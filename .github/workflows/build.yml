name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Build release
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: vsbuilder-portable-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/vsbuilder.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/vsbuilder.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  vsbuilder.exe" | Set-Content vsbuilder.exe.sha256 -Encoding ascii
          gh release create "${{ github.ref_name }}" $exe vsbuilder.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
