[package]
name = "vsbuilder-portable"
version = "1.1.0"
edition = "2021"
description = "Portable, reproducible MSVC Build Tools / Windows SDK package builder for Windows x64"
license = "MIT"
readme = "README.md"
keywords = ["msvc", "windows-sdk", "visual-studio", "portable", "build-tools"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[[bin]]
name = "vsbuilder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2.12", features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"


